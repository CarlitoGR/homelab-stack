# Standalone, NO sign-in: fine on a trusted LAN only. For the authenticated deployment, use ../nas-stack.
# Synology Container Manager: Project -> Create -> point at this folder -> "Use existing compose.yaml".
services:
  timesheet:
    build: .
    image: timesheet-calc:1.1.0
    container_name: timesheet-calc
    ports:
      - "8000:8000" # HOST:CONTAINER. Change the left side if 8000 is taken on the NAS.
    restart: unless-stopped
    read_only: true # app writes nothing to disk
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
