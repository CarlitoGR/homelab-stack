[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "timesheet-calc"
dynamic = ["version"]
description = "Timesheet calculator: elapsed time from start/end pairs and H:MM duration sums."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["timesheet-calc[web]", "pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
timesheet = "timesheet_calc.cli:main"
timesheet-web = "timesheet_calc.web.__main__:main"

[tool.hatch.version]
path = "src/timesheet_calc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/timesheet_calc"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "S", "C4", "SIM", "RET", "PTH", "T20",
    "PL", "PT", "ANN", "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
strict = true
mypy_path = "src"
