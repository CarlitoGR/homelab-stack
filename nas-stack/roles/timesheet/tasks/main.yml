---
- name: Collect the timesheet source tree
  ansible.builtin.set_fact:
    timesheet_tree: >-
      {{ query('community.general.filetree', timesheet_src_dir)
         | rejectattr('path', 'search', timesheet_source_exclude) | list }}

- name: Create timesheet source folders
  ansible.builtin.file:
    path: "{{ timesheet_dir }}/src/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ [''] + (timesheet_tree | selectattr('state', 'equalto', 'directory') | map(attribute='path') | list) }}"
  loop_control:
    label: "{{ item or '.' }}"

- name: Sync timesheet source
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ timesheet_dir }}/src/{{ item.path }}"
    mode: "0644"
  loop: "{{ timesheet_tree | selectattr('state', 'equalto', 'file') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: timesheet_source

- name: Render timesheet compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ timesheet_dir }}/compose.yaml"
    mode: "0644"

- name: Build (when source changed) and start the timesheet app
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_name: timesheet
    compose_stack_dir: "{{ timesheet_dir }}"
    compose_stack_build: "{{ timesheet_source is changed }}"
