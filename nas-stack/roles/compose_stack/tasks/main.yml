---
# Reusable: bring a compose project up, rebuild if asked, and restart services whose mounted config changed.
# Mounted config files are invisible to `compose up`, so callers list those services in
# compose_stack_restart_services.

- name: "Compose | Base command for {{ compose_stack_name }}"
  ansible.builtin.set_fact:
    compose_stack_cmd:
      - "{{ nas_compose_bin }}"
      - --project-name
      - "{{ compose_stack_name }}"
      - --project-directory
      - "{{ compose_stack_dir }}"
      - --file
      - "{{ compose_stack_dir }}/compose.yaml"
    compose_stack_up_args: "{{ ['up', '--detach', '--remove-orphans', '--wait'] + compose_stack_build_args }}"
  vars:
    compose_stack_build_args: "{{ ['--build'] if compose_stack_build | bool else [] }}"

- name: "Compose | Up {{ compose_stack_name }}"
  ansible.builtin.command:
    argv: "{{ compose_stack_cmd + compose_stack_up_args }}"
  register: compose_stack_up
  changed_when: (compose_stack_up.stdout ~ compose_stack_up.stderr) is search('Creat|Recreat|Start|Built|Pulled')

- name: "Compose | Restart services with changed config in {{ compose_stack_name }}"
  ansible.builtin.command:
    argv: "{{ compose_stack_cmd + ['restart'] + compose_stack_restart_services }}"
  when: compose_stack_restart_services | length > 0
  changed_when: true
