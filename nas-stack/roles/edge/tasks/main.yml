---
- name: Create edge folders
  ansible.builtin.file:
    path: "{{ edge_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "", mode: "0755" }
    - { path: caddy/etc, mode: "0755" }
    - { path: caddy/data, mode: "0700" }
    - { path: caddy/config, mode: "0700" }
    - { path: authelia/config, mode: "0700" }
    - { path: authelia/config/certs, mode: "0700" }
    - { path: authelia/secrets, mode: "0700" }
  loop_control:
    label: "{{ item.path or '.' }}"

- name: Write Authelia secrets
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ edge_dir }}/authelia/secrets/{{ item.name }}"
    mode: "0600"
  loop:
    - { name: jwt_secret, value: "{{ vault_authelia_jwt_secret }}" }
    - { name: session_secret, value: "{{ vault_authelia_session_secret }}" }
    - { name: storage_encryption_key, value: "{{ vault_authelia_storage_encryption_key }}" }
    - { name: ldap_password, value: "{{ vault_authelia_ldap_password | default('') }}" }
  no_log: true
  register: edge_secrets

- name: Copy the LDAP server's CA certificate
  ansible.builtin.copy:
    src: "{{ authelia_ldap.ca_cert_src }}"
    dest: "{{ edge_dir }}/authelia/config/certs/ldap-ca.crt"
    mode: "0644"
  when: authelia_ldap_enabled | bool and authelia_ldap.ca_cert_src | length > 0
  register: edge_ldap_ca

- name: Render Authelia configuration
  ansible.builtin.template:
    src: authelia-configuration.yml.j2
    dest: "{{ edge_dir }}/authelia/config/configuration.yml"
    mode: "0600"
  register: edge_authelia_config

- name: Render Authelia users file
  ansible.builtin.template:
    src: authelia-users.yml.j2
    dest: "{{ edge_dir }}/authelia/config/users_database.yml"
    mode: "0600"
  when: not authelia_ldap_enabled | bool
  no_log: true
  register: edge_authelia_users

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ edge_dir }}/caddy/etc/Caddyfile"
    mode: "0644"
  register: edge_caddyfile

- name: Render edge compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ edge_dir }}/compose.yaml"
    mode: "0644"

- name: Start or update the edge stack
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_name: edge
    compose_stack_dir: "{{ edge_dir }}"
    compose_stack_restart_services: >-
      {{ (['authelia'] if (edge_secrets is changed or edge_ldap_ca is changed or edge_authelia_config is changed
          or edge_authelia_users is changed) else [])
         + (['caddy'] if edge_caddyfile is changed else []) }}

- name: Wait for Caddy to create its local certificate authority
  ansible.builtin.wait_for:
    path: "{{ edge_dir }}/caddy/data/caddy/pki/authorities/local/root.crt"
    timeout: 90
  when: edge_fetch_root_cert | bool

- name: Download the root certificate for your devices to trust
  ansible.builtin.fetch:
    src: "{{ edge_dir }}/caddy/data/caddy/pki/authorities/local/root.crt"
    dest: "{{ playbook_dir }}/artifacts/nas-root-ca.crt"
    flat: true
  when: edge_fetch_root_cert | bool
